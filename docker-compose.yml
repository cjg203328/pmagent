# ArtPM Agent — 单栈编排（Streamlit + REST API + Caddy + PostgreSQL/Qdrant）
#
# 用法：
#   cp .env.example .env            # 至少填一个 LLM Key
#   export SITE_ADDRESS=你的域名     # 可选；不填则默认 localhost（本机 HTTPS 测试）
#   docker compose up -d --build    # 一条命令：构建 app + 起 Caddy + Redis + 证书
#   docker compose logs -f          # 跟踪所有服务日志
#   docker compose down             # 停止并移除容器
#
# 数据持久化：宿主 ./data 与 ./logs 挂载进容器 /app/data、/app/logs，
# 所有库（artpm.db / memory.db / conversations.db / vector_store/）
# 与缓存（token_usage.db / episodes.db）都派生自 DATA_ROOT，
# 重启 / 重建镜像都不丢知识库、对话历史与缓存。
# Caddy 证书与配置落在具名卷 caddy-data / caddy-config，续期状态持久化；
# Redis 数据落在 redis-data 卷（AOF 持久化）。

# 站点域名（用于自动 HTTPS）。留空则用 localhost（Caddy 用本地 CA 发证书，便于本机测试）。
# 公网部署时改成已解析到本机公网 IP 的真实域名，如：SITE_ADDRESS=pmagent.example.com
# 也可直接在 .env 里定义 SITE_ADDRESS，compose 会自动读取（此处 ${SITE_ADDRESS:-localhost} 兜底）。

services:
  artpm-agent:
    build: .
    image: artpm-agent:latest
    # 仅暴露到内部网络，由 Caddy 统一对外（更安全：无 TLS 直连被挡在门外）。
    # 如确需局域网明文直连调试，可取消下一行注释：
    # ports:
    #   - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    environment:
      # 数据根目录：所有库与缓存都派生自此（见 artpm_agent.config.resolve_data_root）
      - DATA_ROOT=/app/data
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      # The UI probes the API over the Compose network. Browser/API traffic is
      # still exposed through Caddy under the /api path.
      - ARTPM_API_BASE_URL=http://artpm-api:8765
      - ARTPM_API_REQUIRED=true
      # Redis 连接地址：应用已把 TokenMonitor / EpisodeStore 的热查询接入
      # Redis 作为可丢弃加速层（SQLite 仍为权威源）；REDIS_URL 缺失或不可达时
      # 自动降级为纯 SQLite，不阻断应用。
      - REDIS_URL=redis://redis:6379/0
      # artpm_app is deliberately not a superuser; PostgreSQL superusers bypass RLS.
      - DATABASE_URL=postgresql+psycopg://artpm_app:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before deploying}@postgres:5432/artpm
      - ARTPM_SQLITE_FALLBACK=false
      - VECTOR_BACKEND=qdrant
      - QDRANT_URL=http://qdrant:6333
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - SENTRY_DSN=${SENTRY_DSN:-}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
      otel-collector:
        condition: service_started
    networks:
      - artpm-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; response=urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=4); raise SystemExit(0 if response.status == 200 and response.read(32).strip() == b'ok' else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    # 轻量化资源上限（按机器配置调整；去掉则不限）
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  # REST gateway is a first-class production surface. Keep it internal and
  # let Caddy expose it at /api/* with the same TLS and Basic Auth boundary.
  artpm-api:
    build: .
    image: artpm-agent:latest
    command: ["python", "-m", "artpm_agent.api"]
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    environment:
      - DATA_ROOT=/app/data
      - ARTPM_PROCESS_ROLE=api
      - ARTPM_API_HOST=0.0.0.0
      - ARTPM_API_PORT=8765
      - ARTPM_ENV=production
      - ARTPM_GATEWAY_SHARED_SECRET=${ARTPM_GATEWAY_SHARED_SECRET:?Set ARTPM_GATEWAY_SHARED_SECRET in .env before deploying}
      - ARTPM_CORS_ORIGINS=${ARTPM_CORS_ORIGINS:-}
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+psycopg://artpm_app:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before deploying}@postgres:5432/artpm
      - ARTPM_SQLITE_FALLBACK=false
      - VECTOR_BACKEND=qdrant
      - QDRANT_URL=http://qdrant:6333
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - SENTRY_DSN=${SENTRY_DSN:-}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
      otel-collector:
        condition: service_started
    networks:
      - artpm-net
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; response=urllib.request.urlopen('http://localhost:8765/ready', timeout=4); payload=json.load(response); raise SystemExit(0 if response.status == 200 and payload.get('ready') is True else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  caddy:
    image: caddy:2-alpine
    # 80 用于 ACME 校验 / HTTP→HTTPS 重定向；443 提供 HTTPS（含 HTTP/3 所需的 UDP）
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      # Caddyfile 通过 {$SITE_ADDRESS:localhost} 读取此变量
      - SITE_ADDRESS=${SITE_ADDRESS:-localhost}
      # 基础认证凭据（强制必填，缺失则配置阶段直接报错，绝不以弱默认启动）：
      #   BASIC_AUTH_USER  —— 用户名，如 admin
      #   BASIC_AUTH_HASH  —— bcrypt 哈希，由宿主机生成：
      #       docker run --rm caddy:2-alpine caddy hash-password
      #   在 .env 中填好后再 `docker compose up`（${VAR:?msg} 会在未设置时报错）。
      - BASIC_AUTH_USER=${BASIC_AUTH_USER:?Set BASIC_AUTH_USER in .env (e.g. admin) before deploying}
      - BASIC_AUTH_HASH=${BASIC_AUTH_HASH:?Set BASIC_AUTH_HASH in .env to the bcrypt hash from 'caddy hash-password' before deploying}
    depends_on:
      artpm-agent:
        condition: service_healthy
      artpm-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - artpm-net

  # ── Redis 缓存（默认开启）──
  # 应用把 TokenMonitor / EpisodeStore 热查询接入 Redis 作为加速层，
  # SQLite 始终为权威源；REDIS_URL 缺失或不可达时自动降级为纯 SQLite。
  # 此处默认拉起一个 Redis 实例，通过 artpm-net 供 agent 以
  # redis://redis:6379 访问（见 agent 的 REDIS_URL）。
  # 暂不暴露宿主端口（仅网络内可达）。如需从宿主调试可加 ports: - "6379:6379"
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - artpm-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: artpm
      POSTGRES_USER: artpm_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env before deploying}
      ARTPM_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before deploying}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init-app-role.sh:/docker-entrypoint-initdb.d/10-artpm-app-role.sh:ro
    restart: unless-stopped
    networks:
      - artpm-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artpm_admin -d artpm"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    image: artpm-agent:latest
    command: ["python", "scripts/migrate_postgres.py"]
    environment:
      DATABASE_ADMIN_URL: postgresql+psycopg://artpm_admin:${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env before deploying}@postgres:5432/artpm
      DATABASE_APP_ROLE: artpm_app
      ARTPM_ALEMBIC_DIR: /app/alembic
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - artpm-net

  qdrant:
    image: qdrant/qdrant:v1.15.5
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped
    networks:
      - artpm-net

  tempo:
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./deploy/observability/tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped
    networks:
      - artpm-net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.132.0
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./deploy/observability/otel-collector.yml:/etc/otelcol/config.yml:ro
    depends_on:
      - tempo
    restart: unless-stopped
    networks:
      - artpm-net

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - otel-collector
    restart: unless-stopped
    networks:
      - artpm-net

  grafana:
    image: grafana/grafana:12.1.1
    # Keep local dashboard access available without bypassing the Caddy
    # production boundary on a public interface.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env before deploying}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - tempo
    restart: unless-stopped
    networks:
      - artpm-net

networks:
  artpm-net:
    driver: bridge

volumes:
  caddy-data:
  caddy-config:
  redis-data:
  postgres-data:
  qdrant-data:
  tempo-data:
  prometheus-data:
  grafana-data:
