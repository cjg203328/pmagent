version: '3.8'

services:
  artpm-agent:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env
    environment:
      - DB_PATH=/app/data/artpm.db
      - MEMORY_DB_PATH=/app/data/memory.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "artpm_agent/health_check.py"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 可选: Redis缓存
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:
