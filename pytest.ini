[pytest]
asyncio_mode = auto
pythonpath =
    .
testpaths = artpm_agent tests
markers =
    integration: 需要本地 MCP server / 网络 / API 密钥的集成测试，默认跳过（设 ART_ENABLE_INTEGRATION=1 运行）
    benchmark: 性能基准测试
    slow: 需要较长启动或 UI 重跑时间的离线测试
    contract: 对外 API、部署或组件契约测试
addopts = -ra
filterwarnings =
    ignore:Using `httpx` with `starlette\.testclient` is deprecated.*
