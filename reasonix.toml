[permissions]
allow = ["Bash=wmic logicaldisk get name,size,freespace,description 2>/dev/null || powershell -Command \"Get-PSDrive -PSProvider FileSystem | Select-Object Name,@{n='UsedGB';e={[math]::Round($_.Used/1GB,1)}},@{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}} | Format-Table -AutoSize\"", "Edit", "Bash=powershell -NoProfile -Command 'Get-PSDrive -PSProvider FileSystem | ForEach-Object { $d=$_.Root; if ($_.Used -ne $null) { [PSCustomObject]@{Drive=$d; UsedGB=[math]::Round($_.Used/1GB,1); FreeGB=[math]::Round($_.Free/1GB,1)} } } | Format-Table -AutoSize'", "Bash=powershell -NoProfile -ExecutionPolicy Bypass -File \"D:\\桌面\\xiangmu\\pmagent\\.cleanup_tmp\\scan.ps1\"", "Bash=powershell -NoProfile -Command '$OutputEncoding=[Console]::OutputEncoding=[Text.Encoding]::UTF8; $base=\"$env:APPDATA\\Code\"; Get-ChildItem -LiteralPath $base -Directory -Force -ErrorAction SilentlyContinue | ForEach-Object { $sum=0L; $cnt=0L; [System.IO.Directory]::EnumerateFiles($_.FullName,\"*\",\"AllDirectories\") -ErrorAction SilentlyContinue | ForEach-Object { try { $sum += (Get-Item -LiteralPath $_ -Force).Length; $cnt++ } catch {} }; if ($sum -gt 0) { \"{0,12:N1} MB  {1,8} files  {2}\" -f ($sum/1MB), $cnt, $_.Name } }'", "Bash=powershell -NoProfile -ExecutionPolicy Bypass -File \"D:\\桌面\\xiangmu\\pmagent\\.cleanup_tmp\\cleanup.ps1\""]
