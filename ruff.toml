exclude = [
    "artpm_agent/app_backup.py",
    "artpm_agent/app_old.py",
    "artpm_agent/app_simple.py",
    "artpm_agent/artpm_agent/",
    "artpm_agent/core/chat_agent.py",
    "artpm_agent/core/llm_client.py",
    "artpm_agent/core/rag_system.py",
    "artpm_agent/core/skills.py",
    "artpm_agent/core/mcp_skills.py",
    "artpm_agent/core/tools.py",
    "artpm_agent/test_*.py",
]

# Pin the rule set this project is written and reviewed against.
# The repository was cleaned and kept green under Ruff's historical default
# rule set (E4/E7/E9/F). Ruff 0.16 widened its defaults (UP/UP006, I001,
# BLE001, S and others), which re-flagged thousands of pre-existing style
# items and broke `ruff check artpm_agent tests` on a clean checkout. Declare
# the baseline explicitly so local runs, scripts, and CI all agree instead of
# silently following whatever default set a Ruff release happens to ship.
[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
"tests/*.py" = ["E402"]
"tests/test_basic.py" = ["F841"]
"tests/test_mcp_enhanced.py" = ["F541", "F841"]
"tests/test_mcp_simple.py" = ["F541"]
# app.py 拆分之后的共享层/页面模块：使用 `from ui_helpers import *` 复用符号
"artpm_agent/app.py" = ["F403", "F405"]
"artpm_agent/ui_helpers.py" = ["F401"]
"artpm_agent/pages/*.py" = ["F401", "F403", "F405"]
