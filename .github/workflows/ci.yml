name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: pip install -e ".[dev]"

    - name: Lint with Ruff
      run: ruff check artpm_agent tests

    - name: Type check with mypy
      run: mypy artpm_agent --ignore-missing-imports
      continue-on-error: true

    - name: Run tests
      run: pytest -v

    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml

  security:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'

    - name: Install project dependencies
      run: pip install -e .

    - name: Run Bandit security scan
      run: |
        pip install bandit
        bandit -r artpm_agent -f json -o bandit-report.json
      continue-on-error: true

    - name: Run Safety check
      run: |
        pip install safety
        safety check --json

  build:
    needs: [test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
    - uses: actions/checkout@v3

    - name: Build Docker image
      run: docker build -t "${{ secrets.DOCKER_USERNAME }}/artpm-agent:latest" .

    - name: Push to registry
      run: |
        echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
        docker push "${{ secrets.DOCKER_USERNAME }}/artpm-agent:latest"
