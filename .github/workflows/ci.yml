name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: pip install -e ".[dev]"

    - name: Lint with Ruff
      run: ruff check artpm_agent tests --output-format=github

    - name: Type check with mypy
      run: mypy artpm_agent --ignore-missing-imports
      continue-on-error: true

    # Coverage source, reports, and the fail-under gate all come from
    # pytest.ini so local runs and CI cannot drift apart.
    - name: Run tests with coverage
      run: pytest -v

    - name: Run integration tests
      run: pytest tests/integration/ -v
      env:
        ART_ENABLE_INTEGRATION: "1"
      continue-on-error: true

    - name: Run offline performance regression gate
      run: >-
        python -m benchmarks.core_performance
        --samples 12
        --warmups 2
        --output artifacts/core-performance.json
        --enforce

    - name: Upload performance report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: core-performance-${{ matrix.python-version }}-${{ github.run_id }}
        path: artifacts/core-performance.json
        if-no-files-found: warn

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: python-${{ matrix.python-version }}
        fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install project dependencies
      run: pip install -e .

    - name: Run Bandit security scan
      run: |
        pip install bandit
        bandit -r artpm_agent -f json -o bandit-report.json
      continue-on-error: true

    - name: Run Safety check
      run: |
        pip install safety
        safety check --json
      continue-on-error: true

    - name: Upload security reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: bandit-report.json

  build:
    needs: [test, security]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Build Python package
      run: |
        pip install build
        python -m build

    - name: Upload distribution
      uses: actions/upload-artifact@v4
      with:
        name: python-package
        path: dist/

    - name: Build Docker image
      run: docker build -t "${{ secrets.DOCKER_USERNAME }}/artpm-agent:${{ github.sha }}" .

    - name: Push to registry
      if: github.event_name == 'push'
      run: |
        echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
        docker push "${{ secrets.DOCKER_USERNAME }}/artpm-agent:${{ github.sha }}"
        docker tag "${{ secrets.DOCKER_USERNAME }}/artpm-agent:${{ github.sha }}" "${{ secrets.DOCKER_USERNAME }}/artpm-agent:latest"
        docker push "${{ secrets.DOCKER_USERNAME }}/artpm-agent:latest"

