name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTEST_ADDOPTS: --timeout=120
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: pip install -e ".[dev]"

    - name: Lint with Ruff
      run: ruff check artpm_agent tests --output-format=github

    - name: Type check with mypy
      run: mypy artpm_agent --ignore-missing-imports
      continue-on-error: true

    - name: Run offline tests
      run: pytest -q --no-cov -m "not integration and not benchmark"

    - name: Run focused coverage gate
      run: python scripts/coverage_core.py

    - name: Run integration tests
      # Run every explicitly marked integration contract, including the live
      # MCP probe that lives beside the unit tests.  Missing external
      # credentials are handled as explicit skips by the test fixtures.
      run: pytest tests/integration/ tests/test_mcp.py -v
      env:
        ART_ENABLE_INTEGRATION: "1"

    - name: Run benchmark tests
      run: pytest tests/test_phase1_optimizations.py -m benchmark -v --no-cov

    - name: Run offline performance regression gate
      run: >-
        python -m benchmarks.core_performance
        --samples 12
        --warmups 2
        --output artifacts/benchmarks/core-performance.json
        --enforce

    - name: Upload performance report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: core-performance-${{ matrix.python-version }}-${{ github.run_id }}
        path: artifacts/benchmarks/core-performance.json
        if-no-files-found: warn

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./artifacts/quality/coverage.xml
        flags: python-${{ matrix.python-version }}
        fail_ci_if_error: false

  # Whole-project coverage is a deliberately low baseline while the legacy UI
  # and storage modules are being decomposed. The focused modernization gate
  # above remains the higher-signal boundary check.
  coverage:
    name: Whole-project coverage baseline
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    - name: Install dependencies
      run: pip install -e ".[dev]"
    - name: Run tests with baseline coverage gate
      run: >-
        pytest -q --cov=artpm_agent --cov-report=term-missing
        --cov-fail-under=20
        -m "not integration and not benchmark"

  security:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install project dependencies
      run: pip install -e .

    - name: Run Bandit security scan
      run: |
        pip install bandit
        bandit -r artpm_agent -f json -o bandit-report.json
      continue-on-error: true

    - name: Run Safety check
      run: |
        pip install safety
        safety check --json
      continue-on-error: true

    - name: Upload security reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: bandit-report.json

  build:
    needs: [test, security]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Build Python package
      run: |
        pip install build
        python -m build

    - name: Upload distribution
      uses: actions/upload-artifact@v4
      with:
        name: python-package
        path: dist/

    - name: Build Docker image
      run: docker build -t "${{ secrets.DOCKER_USERNAME }}/artpm-agent:${{ github.sha }}" .

    - name: Push to registry
      if: github.event_name == 'push'
      run: |
        echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
        docker push "${{ secrets.DOCKER_USERNAME }}/artpm-agent:${{ github.sha }}"
        docker tag "${{ secrets.DOCKER_USERNAME }}/artpm-agent:${{ github.sha }}" "${{ secrets.DOCKER_USERNAME }}/artpm-agent:latest"
        docker push "${{ secrets.DOCKER_USERNAME }}/artpm-agent:latest"
