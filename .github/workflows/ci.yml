name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTEST_ADDOPTS: --timeout=120
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      # The build backend is installed explicitly. `pip install -e ".[dev]"`
      # does not pull in setuptools, and Python 3.12 stopped seeding venv with
      # it while 3.10/3.11 still do. test_package_imports builds a wheel with
      # --no-build-isolation, meaning it uses *this* environment's backend, so
      # relying on a venv default makes the matrix behave differently per
      # version — 3.12 failed while 3.10/3.11 passed.
      run: |
        pip install --upgrade pip setuptools wheel
        pip install -e ".[dev]"

    - name: Validate workflow context usage
      # Runs first and cheaply. An invalid context reference makes GitHub reject
      # the entire workflow, which surfaces only as a run with zero jobs and no
      # message, so it is worth failing loudly here instead.
      run: python scripts/validate_workflows.py

    - name: Lint with Ruff
      run: ruff check artpm_agent tests --output-format=github

    - name: Run offline tests
      run: pytest -q --no-cov -m "not integration and not benchmark"

    - name: Run focused coverage gate
      run: python scripts/coverage_core.py

    - name: Run integration tests
      # Run every explicitly marked integration contract, including the live
      # MCP probe that lives beside the unit tests.  Missing external
      # credentials are handled as explicit skips by the test fixtures.
      run: pytest tests/integration/ tests/test_mcp.py -v
      env:
        ART_ENABLE_INTEGRATION: "1"

    - name: Run benchmark tests
      run: pytest tests/test_phase1_optimizations.py -m benchmark -v --no-cov

    - name: Run offline performance regression gate
      run: >-
        python -m benchmarks.core_performance
        --samples 12
        --warmups 2
        --output artifacts/benchmarks/core-performance.json
        --enforce

    - name: Upload performance report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: core-performance-${{ matrix.python-version }}-${{ github.run_id }}
        path: artifacts/benchmarks/core-performance.json
        if-no-files-found: warn

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./artifacts/quality/coverage.xml
        flags: python-${{ matrix.python-version }}
        fail_ci_if_error: false

  typecheck:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: pip install -e ".[dev]"

    - name: Type check with mypy (incremental gate)
      # The project carries a large pre-existing type-error backlog, so a plain
      # `mypy` run cannot block PRs. scripts/mypy_gate.py compares against
      # mypy-baseline.txt and fails only on newly introduced errors.
      #
      # This runs on a single pinned interpreter on purpose: mypy's output
      # depends on the resolved dependency versions (e.g. numpy's stubs differ
      # between the 3.10 and 3.12 resolutions), so one baseline cannot be
      # shared across the whole test matrix.
      run: python scripts/mypy_gate.py

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
    - uses: actions/checkout@v4

    - name: Set up pnpm
      uses: pnpm/action-setup@v4
      with:
        package_json_file: frontend/package.json

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: pnpm
        cache-dependency-path: frontend/pnpm-lock.yaml

    - name: Install frontend dependencies
      run: pnpm install --frozen-lockfile

    - name: Type check frontend
      run: pnpm typecheck

    - name: Test frontend
      run: pnpm test

    - name: Build frontend
      run: pnpm build

  security:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install project dependencies
      # Build tools are upgraded for the same reason as in the test matrix, and
      # for one specific to this job: pip-audit audits the whole environment,
      # and the runner's preinstalled pip/setuptools carry known advisories. Left
      # alone, the audit below reports the runner's own tooling — pip 25.0.1 and
      # setuptools 70.0.0 produced 16 findings — instead of the project's
      # dependencies.
      run: |
        pip install --upgrade pip setuptools wheel
        pip install -e .

    - name: Run Bandit security scan
      # Two commands with different jobs, and the distinction matters:
      #   * The report run must NOT fail the job. Bandit exits 1 whenever it
      #     finds anything, and this codebase has ~160 medium/low findings that
      #     are triaged by humans. Without --exit-zero the report step fails the
      #     whole job and the HIGH gate below never even runs.
      #   * The HIGH gate is the blocking check. It exits 1 on any HIGH finding
      #     and 0 when there are none.
      run: |
        pip install bandit
        bandit -r artpm_agent -f json -o bandit-report.json --exit-zero
        bandit -r artpm_agent --severity-level high --confidence-level high

    - name: Audit dependencies for known vulnerabilities
      # pip-audit is the PyPA-maintained replacement for `safety`: no account
      # needed, and it does not itself pull in vulnerable transitive deps.
      #
      # It audits the whole environment rather than just the project's declared
      # dependencies, which is deliberate — an advisory in a transitive
      # dependency is a real risk. That is also why the install step above
      # upgrades pip/setuptools first; otherwise this fails on the runner's own
      # build tooling before it ever looks at the project.
      run: |
        pip install pip-audit
        pip-audit --progress-spinner off

    - name: Upload security reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: bandit-report.json

  build:
    needs: [test, typecheck, frontend, security]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Build Python package
      run: |
        pip install build
        python -m build

    - name: Upload distribution
      uses: actions/upload-artifact@v4
      with:
        name: python-package
        path: dist/

    - name: Build Docker image
      # Tagged locally on purpose. Building an image is a verification step and
      # must not depend on a registry account: interpolating an unset
      # DOCKER_USERNAME produces "/artpm-agent:<sha>", which is not a valid
      # image reference, so `docker build` fails on the tag before it ever
      # compiles the Dockerfile. Publishing is a separate, opt-in step below.
      run: docker build -t artpm-agent:${{ github.sha }} .

    - name: Push to registry
      # Publishing requires registry credentials, which are deployment config
      # rather than something every clone has. The presence check lives in the
      # shell rather than in `if:` because the `secrets` context is NOT available
      # to step-level `if` expressions — referencing it there makes the whole
      # workflow invalid, and GitHub reports that as a run with zero jobs and no
      # useful message. `steps.env` does allow `secrets`, so map them first.
      if: github.event_name == 'push'
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      run: |
        if [ -z "$DOCKER_USERNAME" ] || [ -z "$DOCKER_PASSWORD" ]; then
          echo "::notice title=Docker publish skipped::DOCKER_USERNAME/DOCKER_PASSWORD are not configured, so the image was built but not pushed. Set both repository secrets to enable publishing."
          exit 0
        fi
        echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
        docker tag artpm-agent:${{ github.sha }} "$DOCKER_USERNAME/artpm-agent:${{ github.sha }}"
        docker push "$DOCKER_USERNAME/artpm-agent:${{ github.sha }}"
        docker tag artpm-agent:${{ github.sha }} "$DOCKER_USERNAME/artpm-agent:latest"
        docker push "$DOCKER_USERNAME/artpm-agent:latest"
